# Configuration for zizmor (https://docs.zizmor.sh/configuration/), a static
# analysis tool for GitHub Actions workflows.
#
# This grandfathers in every offense zizmor reports against the workflows as
# they existed on 2026-08-05, so that running zizmor going forward only
# surfaces newly introduced issues rather than the pre-existing backlog.
# Entries are `file:line` pairs pointing at each finding's primary location;
# regenerate with `zizmor --format json-v1 .` after fixing/reviewing findings.
#
# `artipacked` has been fixed (persist-credentials: false added everywhere)
# and removed from this list.
rules:
  cache-poisoning:
    ignore:
      - ci-cd.yml:41
      - ci-cd.yml:71
      - ci-cd.yml:113
  secrets-inherit:
    ignore:
      - ci-cd.yml:148
      - ci-cd.yml:167
      - ci-cd.yml:178
      - ci-cd.yml:185
  template-injection:
    ignore:
      - deploy.yml:95
      - deploy.yml:96
      - deploy.yml:97
      - deploy.yml:98
      - deploy.yml:103
      - deploy.yml:106
      - deploy.yml:122
      - deploy.yml:123
      - deploy.yml:163
      - deploy.yml:179
  unpinned-uses:
    ignore:
      - bump-version.yml:25
      - bump-version.yml:30
      - ci-cd.yml:25
      - ci-cd.yml:30
      - ci-cd.yml:41
      - ci-cd.yml:66
      - ci-cd.yml:71
      - ci-cd.yml:108
      - ci-cd.yml:113
      - ci-cd.yml:128
      - ci-cd.yml:139
      - close_stale_issues_and_prs.yml:16
      - deploy.yml:126
      - deploy.yml:131
      - dispatch-learner-experience-e2e.yml:31
